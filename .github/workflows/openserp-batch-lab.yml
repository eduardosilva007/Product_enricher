name: OpenSERP isolated batch lab
run-name: openserp-${{ inputs.run_nonce }}

on:
  workflow_dispatch:
    inputs:
      run_nonce:
        description: "Unique orchestration correlation ID (optional for manual runs)"
        required: false
        default: manual
        type: string
      engine:
        description: "Search engine"
        required: true
        default: google
        type: choice
        options:
          - google
          - bing
          - duckduckgo
      sku_lines:
        description: "One BRAND|MODEL per line; max 10. Example: BRIGGS & STRATTON|40U7770010"
        required: true
        default: |
          STIHL|MS382
          STIHL|FS250
          NOVABOT|N2000
        type: string

permissions:
  contents: read

concurrency:
  group: openserp-batch-lab
  cancel-in-progress: false

jobs:
  batch:
    name: Read-only batch and import-ready normalization
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENSERP_ENGINE: ${{ inputs.engine }}
      OPENSERP_SKUS: ${{ inputs.sku_lines }}
    steps:
      - name: Verify exact workflow branch and SHA
        shell: bash
        env:
          EXPECTED_REF: refs/heads/fix/openserp-durable-failure-20261118
        run: |
          set -euo pipefail
          echo "Executing ref: $GITHUB_REF"
          echo "Executing sha: $GITHUB_SHA"
          test "$GITHUB_REF" = "$EXPECTED_REF" || { echo "WRONG_BRANCH_ABORT"; exit 1; }

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Confirm updated OpenSERP collector and tests are paired
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          source=Path(".github/scripts/openserp_batch_lab.py")
          spec=importlib.util.spec_from_file_location("openserp_lab", source)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          records=module.parse_skus("BRIGGS & STRATTON|40U7770010")
          assert len(records)==1
          assert records[0]["brand"]=="BRIGGS & STRATTON"
          assert records[0]["model"]=="40U7770010"
          tests=Path(".github/scripts/test_openserp_batch_lab.py").read_text(encoding="utf-8")
          assert "test_multiword_brand_is_preserved" in tests
          print("COLLECTOR_TEST_CONTRACT_OK")
          PY

      - name: Python contract tests (offline, no provider calls)
        shell: bash
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_openserp_batch_lab.py' -v

      - name: Validate batch before launching OpenSERP
        shell: bash
        run: |
          python3 - <<'PY'
          import importlib.util
          import os
          spec = importlib.util.spec_from_file_location("lab", ".github/scripts/openserp_batch_lab.py")
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          batch = mod.parse_skus(os.environ["OPENSERP_SKUS"])
          print(f"Validated {len(batch)} explicit BRAND|MODEL SKUs")
          PY

      - name: Start isolated service
        shell: bash
        run: |
          set -euo pipefail
          docker pull karust/openserp:latest
          docker run --detach --init --rm --name openserp-batch-lab --shm-size=2g \
            -p 127.0.0.1:7000:7000 \
            karust/openserp:latest serve -a 0.0.0.0 -p 7000

      - name: Collect and normalize
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/openserp_batch_lab.py \
            --engine "$OPENSERP_ENGINE" \
            --skus "$OPENSERP_SKUS" \
            --output-dir openserp-lab-results

      - name: Validate import-ready artifact contract
        shell: bash
        run: |
          set -euo pipefail
          test -s openserp-lab-results/pilot_summary.json
          test -s openserp-lab-results/openserp_manifest.csv
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          base=Path("openserp-lab-results")
          doc=json.loads((base/"pilot_summary.json").read_text(encoding="utf-8"))
          rows=list(csv.DictReader((base/"openserp_manifest.csv").open(encoding="utf-8")))
          assert isinstance(doc.get("results"), list)
          assert rows
          assert len(doc["results"]) == len(rows)
          assert all(x.get("provider")=="openserp" and x.get("status")=="CAPTURED" for x in doc["results"])
          assert all(isinstance(x.get("organic"), list) for x in doc["results"])
          print(f"Import-ready captured cohorts: {len(rows)}")
          PY

      - name: Diagnose failed collector or OpenSERP service
        if: failure()
        shell: bash
        run: |
          echo "::group::OpenSERP container status"
          docker ps -a --filter name=openserp-batch-lab || true
          echo "::endgroup::"
          echo "::group::OpenSERP container logs"
          docker logs --tail 120 openserp-batch-lab 2>&1 || true
          echo "::endgroup::"
          echo "::group::Captured artifact inventory"
          find openserp-lab-results -maxdepth 1 -type f -printf '%f %s bytes\\n' 2>/dev/null || true
          echo "::endgroup::"

      - name: Upload isolated artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openserp-batch-${{ github.run_id }}
          path: openserp-lab-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Stop service
        if: always()
        shell: bash
        run: docker stop openserp-batch-lab || true
