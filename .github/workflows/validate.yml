name: Validate Product Enricher

on:
  push:
    branches:
      - main
      - "feature/**"
      - "feat/**"
      - "fix/**"
      - "pilot/**"
  pull_request:
    branches:
      - main

jobs:
  validate-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile pipeline and quality harness
        run: python -m py_compile pipeline_produtos.py pilot_v41_ab.py classification_engine_v42.py semantic_bge_v42.py v42_adapters.py classify_v42.py validate_v42_acceptance.py quality_gate.py tools/architecture_check.py tools/repo_audit.py tools/runtime_doctor.py tools/change_impact.py tools/classification_eval.py tools/incident_auditor.py tools/release_gate.py

      - name: Install baseline test dependencies
        run: python -m pip install pandas openpyxl numpy requests transformers scikit-learn

      - name: Run repository release gate in CI mode
        run: python tools/release_gate.py --phase preflight --mode ci --provider none

      - name: Validate JSON syntax
        run: |
          python -m json.tool pipeline_config.json > /dev/null
          python -m json.tool collection_quality_policy.json > /dev/null
          python -m json.tool regras_negocio.json > /dev/null
