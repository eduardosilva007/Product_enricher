name: Validate Product Enricher

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "pilot/**"
  pull_request:
    branches:
      - main

jobs:
  validate-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile pipeline
        run: python -m py_compile pipeline_produtos.py pilot_v41_ab.py classification_engine_v42.py v42_adapters.py classify_v42.py validate_v42_acceptance.py

      - name: Install baseline test dependencies
        run: python -m pip install pandas openpyxl numpy requests

      - name: Run evidence cache regressions
        run: python -m unittest test_v407_evidence_cache.py test_v4071_identity_rescue.py test_v4072_identity_runtime_guard.py test_v4073_structural_sku_core.py test_classifier_power_regression.py test_classifier_family_regression.py test_input_registration.py test_v41_pilot_identity.py test_v42_engine_contracts.py -v

      - name: Validate JSON syntax
        run: |
          python -m json.tool pipeline_config.json > /dev/null
          python -m json.tool collection_quality_policy.json > /dev/null
          python -m json.tool regras_negocio.json > /dev/null
