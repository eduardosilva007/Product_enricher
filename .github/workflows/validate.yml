name: Validate Product Enricher

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  validate-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install offline test dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Compile pipeline and night launcher
        run: python -m py_compile pipeline_produtos.py scripts/launch_night_output_only.py scripts/audit_overnight_940_eligible.py scripts/check_overnight_940_offline.py

      - name: Run evidence cache regressions
        run: python -m unittest test_v407_evidence_cache.py test_v4071_identity_rescue.py test_v4072_identity_runtime_guard.py test_v4073_structural_sku_core.py -v

      - name: Gate DCA taxonomy regressions first (9 cases)
        run: python -m unittest tests.test_dca_evidence_regression -v

      - name: Run offline tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate JSON syntax
        run: |
          python -m json.tool pipeline_config.json > /dev/null
          python -m json.tool collection_quality_policy.json > /dev/null
          python -m json.tool regras_negocio.json > /dev/null

  windows-sqlite-cleanup:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install offline test dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Verify history SQLite closes on Windows
        run: python -m unittest discover -s tests -p "test_overnight_history_and_power_support.py" -v

      - name: Gate DCA taxonomy regressions first on Windows (9 cases)
        run: python -m unittest tests.test_dca_evidence_regression -v

      - name: Verify existing overnight contracts on Windows
        run: python -m unittest discover -s tests -p "test_raw_empty_night_contract.py" -v

      - name: Verify RAW_OK baseline synchronization on Windows
        run: python -m unittest discover -s tests -p "test_baseline_final_authority_regression.py" -v

      - name: Verify physical BI lock audit on Windows
        run: python -m unittest discover -s tests -p "test_940_exact_human_audit.py" -v

      - name: Verify output-only night safety on Windows
        run: python -m unittest discover -s tests -p "test_night_output_only_contract.py" -v
